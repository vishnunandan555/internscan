name: Update Tech Internship Listings

on:
  schedule:
    - cron: "30 21 * * *" # Daily at 21:30 UTC (03:00 AM IST Asia/Kolkata)
  workflow_dispatch:
    inputs:
      company:
        description: "Company to scrape (leave blank for all 55)"
        required: false
        default: ""
      country:
        description: "Country code to scrape (e.g. in, us, or blank for all)"
        required: false
        default: ""
      keyword:
        description: "Filter by title keyword (e.g. 2027, hardware)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (test scrape without committing changes)"
        type: boolean
        default: false
      workers:
        description: "Concurrency worker threads (default: 8)"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      failed: ${{ steps.scrape.outputs.failed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Run concurrent scraper
        id: scrape
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_COLOR: "1"
          SCRAPER_COMPANY: ${{ github.event.inputs.company }}
          SCRAPER_COUNTRY: ${{ github.event.inputs.country }}
          SCRAPER_KEYWORD: ${{ github.event.inputs.keyword }}
          SCRAPER_DRY_RUN: ${{ github.event.inputs.dry_run }}
          SCRAPER_WORKERS: ${{ github.event.inputs.workers }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m scraper.main

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md LIST.md lists/ data/ docs/ logs/
          if git diff --cached --quiet; then
            echo "No database or README changes to commit."
            exit 0
          fi
          ADDED="${{ steps.scrape.outputs.added }}"
          CLOSED="${{ steps.scrape.outputs.closed }}"
          if [ "$ADDED" != "0" ] && [ -n "$ADDED" ]; then
            MSG="data(sync): 🆕 $ADDED new internship(s) (+$ADDED / -$CLOSED) [skip ci]"
          elif [ "$CLOSED" != "0" ] && [ -n "$CLOSED" ]; then
            MSG="data(sync): 🔻 $CLOSED internship(s) closed (+$ADDED / -$CLOSED) [skip ci]"
          else
            MSG="data(sync): refresh verified listings (+$ADDED / -$CLOSED) [skip ci]"
          fi
          git commit -m "$MSG"
          git pull --rebase
          git push

  report-issues:
    needs: scrape
    if: needs.scrape.outputs.failed != '0' && needs.scrape.outputs.failed != '' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report scraper failures as GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "data/health.json" ]; then
            exit 0
          fi
          python3 -c "
          import json
          with open('data/health.json', encoding='utf-8') as f:
              d = json.load(f)
          failed = d.get('failed', {})
          title = 'scraper failure: ' + ', '.join(sorted(failed.keys()))
          with open('/tmp/issue_title.txt', 'w', encoding='utf-8') as f:
              f.write(title)
          body = '\n'.join('- **%s**: %s' % kv for kv in sorted(failed.items()))
          body += '\n\nA company careers API changed or is temporarily down. Existing listings for it are preserved until it scrapes successfully again.\n'
          with open('/tmp/issue_body.txt', 'w', encoding='utf-8') as f:
              f.write(body)
          "
          TITLE=$(cat /tmp/issue_title.txt)
          gh label create scraper-health --color D93F0B --description "a careers-API scraper is failing" 2>/dev/null || true
          # avoid duplicate issues for the same breakage
          if ! gh issue list --state open --search "$TITLE in:title" --json title -q '.[].title' | grep -qF "$TITLE"; then
            gh issue create --title "$TITLE" --body-file /tmp/issue_body.txt --label scraper-health || true
          fi

