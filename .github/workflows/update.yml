name: Update Tech Internship Listings

on:
  schedule:
    - cron: "30 21 * * *" # Daily at 21:30 UTC (03:00 AM IST Asia/Kolkata)
  workflow_dispatch:
    inputs:
      company:
        description: "Company to scrape (leave blank for all 55)"
        required: false
        default: ""
      country:
        description: "Country code to scrape (e.g. in, us, or blank for all)"
        required: false
        default: ""
      keyword:
        description: "Filter by title keyword (e.g. 2027, hardware)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (test scrape without committing changes)"
        type: boolean
        default: false
      workers:
        description: "Concurrency worker threads (default: 8)"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      failed: ${{ steps.scrape.outputs.failed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Run concurrent scraper
        id: scrape
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_COLOR: "1"
          SCRAPER_COMPANY: ${{ github.event.inputs.company }}
          SCRAPER_COUNTRY: ${{ github.event.inputs.country }}
          SCRAPER_KEYWORD: ${{ github.event.inputs.keyword }}
          SCRAPER_DRY_RUN: ${{ github.event.inputs.dry_run }}
          SCRAPER_WORKERS: ${{ github.event.inputs.workers }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m scraper.main

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md regions/ data/ docs/ logs/
          if git diff --cached --quiet; then
            echo "No database or README changes to commit."
            exit 0
          fi
          ADDED="${{ steps.scrape.outputs.added }}"
          CLOSED="${{ steps.scrape.outputs.closed }}"
          if [ "$ADDED" != "0" ] && [ -n "$ADDED" ]; then
            MSG="data(sync): 🆕 $ADDED new internship(s) (+$ADDED / -$CLOSED) [skip ci]"
          elif [ "$CLOSED" != "0" ] && [ -n "$CLOSED" ]; then
            MSG="data(sync): 🔻 $CLOSED internship(s) closed (+$ADDED / -$CLOSED) [skip ci]"
          else
            MSG="data(sync): refresh verified listings (+$ADDED / -$CLOSED) [skip ci]"
          fi
          git commit -m "$MSG"
          git pull --rebase
          git push

  report-issues:
    needs: scrape
    if: always() && needs.scrape.result == 'success' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Synchronize scraper health with GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_health_issues.py

