name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Validate store & API generation
        run: |
          python -c "from scraper import store, api; api.generate_apis(store.load())"

      - name: Check README generation
        run: |
          python -c "from scraper import store, render_readme; render_readme.render(store.load())"
